# .ai/manifest.yaml — the agent-facing contract for this repo.
# Capabilities are tool-NEUTRAL (a name -> the command that fulfils it), the heavy subsystems are
# referenced by path, and unknown fields MUST be ignored — so this survives tool churn and schema
# growth. Shape reference: personas/.ai/manifest.yaml + docs/AI_MANIFEST_SPEC.md there.
schema: ai-manifest
schemaVersion: 0.1.0
generatedAt: "2026-08-24"
generatedFrom: [Cargo.toml, justfile, .github/workflows/ci.yml, rust-toolchain.toml]

repo:
  name: pumper
  purpose: "Local-first scraping service: one Rust binary exposing an HTTP API over a durable SQLite job queue and pluggable scrape engines"
  languages: [rust, typescript]
  archetype: service

# Capabilities, not tools. Add keys freely; older readers ignore unknown ones.
# `verified` is a claim the doctor flips to true once it has actually run the command.
# The repo-root justfile is the canonical task runner; these are its raw-cargo equivalents,
# which is what .github/workflows/ci.yml actually invokes. Everything runs from the repo root.
capabilities:
  build: { command: "cargo build -p pumper-server", verified: false }
  test: { command: "cargo test --workspace", verified: false }
  test-ignored: { command: "cargo test --workspace -- --ignored", verified: false }
  lint: { command: "cargo clippy --workspace --all-targets -- -D warnings", verified: false }
  typecheck: { command: "cargo check --workspace", verified: false }
  fmt-check: { command: "cargo fmt --check", verified: false }
  ci: { command: "just ci", verified: false }
  audit: { command: "cargo deny check advisories bans sources", verified: false }
  # The fixture suite, NOT the hook itself: the hook reads a Stop-hook payload on
  # stdin, so invoking it bare now exits 3 ("cannot check" — it used to exit 0,
  # which is the false green this capability would have advertised as a pass).
  doc-sync: { command: "just doc-sync", verified: false }
  smoke: { command: "pwsh -File scripts/smoke.ps1", verified: false }
  plugins-verify: { command: "just plugins-verify", verified: false }
  sdk-typecheck: { command: "npm --prefix clients/typescript run typecheck", verified: false }
  sdk: { command: "just sdk", verified: false }
  inventory: { command: "just inventory", verified: false }
  # The quarantine register as a gate: expiry, ceiling, and the two-direction
  # reconciliation between the register and the tree's #[ignore]s. Three outcomes,
  # three exit codes (0 clean / 2 findings / 3 CANNOT CHECK) — a 3 is not a pass.
  flake-check: { command: "just flake-check", verified: false }
  # The fixture suites behind flake-check and lane-certify. A gate never observed
  # going red is indistinguishable from a gate that cannot.
  harness-test: { command: "just harness-test", verified: false }
  # Long-lane CERTIFICATION, not a gate: its own clock (the nightly CI leg), its
  # own pre-declared statistical criteria, one artifact per run. Minutes — which
  # is exactly why it is not in `ci` below.
  lanes: { command: "just lanes", verified: false }

# Pointers — these subsystems can change format underneath without breaking this contract.
paths:
  contextMap: context-map.json
  memory: MEMORY.md
  vault: .perfect/
  evals: evals/
  policy: .claude/CLAUDE.md
  onboarding: ONBOARDING.md
  catalog: catalog/data-sources.toml
  featureDocs: docs/features/
  docSyncMap: scripts/docs/feature-doc-map.json

context:
  rule: "46 contexts across 8 groups in context-map.json; read it at task start to scope edits"

boundaries:
  neverTouch: [target/, data/, Cargo.lock]
  dependencyRule: "apps depend only on core (plus parsing libs); engines depend only on core; the server wires everything. Never make an app depend on another app or on an engine crate."
  secretsFrom: ".env at the repo root (CWD-relative loader); config.toml or $PUMPER_CONFIG for non-secret keys"

# The control model: where each capability is ACTUALLY enforced, which is not the
# same list as where we would like it enforced. This file used to advertise a
# `prePush: [fmt-check, lint, doc-sync]` rung; no pre-push hook exists in this
# repo (git hooks are not versioned and no core.hooksPath is set), so that rung
# refused nothing on any clone. A projection that overstates a gate is worse than
# a missing one — it is read as authoritative.
controls:
  # Habit, not gate: what an author runs before pushing. `just ci` now invokes
  # exactly the same jobs CI runs, so a local green predicts the remote one.
  prePushHabit: [ci]
  # The only installed local hook: a Claude Code Stop hook (.claude/settings.json
  # -> scripts/docs/check-doc-sync.mjs). Advisory by construction — exit 2 is a
  # reminder that never blocks, and it runs on no clone that lacks the settings.
  localAdvisory: [doc-sync]
  # The binding rung. Everything below it is a latency optimization.
  ciHardPass: [fmt-check, lint, test, audit, plugins-verify, sdk, inventory, flake-check, harness-test]
  # Certification, NOT a gate — and the distinction is the technique's, not a
  # convenience: a long lane judges behaviour over time, which is not a property
  # of any single change, so blocking a merge on it would destroy the merge
  # cadence without improving the certification. Runs on the nightly cron
  # (`41 5 * * *`) and on workflow_dispatch; its verdicts are trend data.
  scheduledCertification: [lanes]

# The organization's AI registry - knowledge bundles this repo consumes and the skill
# marketplace it installs from. Unknown fields MUST be ignored by a reader.
# registered from the secondary machine (mkdol) 2026-08-24
registry:
  remote: github:xkazm04/ai-registry
  local: ../ai-registry
  machine: secondary
  contributor: mkdol-dev-box
  # This repo audited against the bundle: per-technique verdicts plus the ranked
  # backlog future waves drain. A pointer, not an embed — the file's own format
  # can change underneath without touching this contract.
  conformance: .ai/registry-conformance.md
knowledge:
  domains: [software-engineering, llm-observability]

# Shared skills this project uses, from the registry's skills/ lane. The LINK is machine
# state (gitignored, made by ai-registry/scripts/link-skills.mjs); THIS list is the
# reviewable declaration. A skill not listed here is project-owned and lives in
# .claude/skills/ as a real directory.
skills:
  - architect
  - conform
  - consult
  - explorer
  - perfect
  - research
  - scan-sweep
  - ship-loop
  - test-before-commit
  - tiger

# Scope - what this project does and deliberately does not do. Read by the registry's
# scripts/build-fleet-map.mjs to classify subjects this project has NO context for: an
# absence inside an out-of-scope category or subject is never proposed as a new direction;
# every other in-domain absence is a `candidate` for the intake direction pass. Keys are
# `<bundle>/<category>[/<subcategory>]` and `<bundle>/<subject>`. Decisions on proposed
# directions live in .ai/directions/ledger.jsonl. DRAFT written by the registry on
# 2026-09-02 from the purpose line and the project note - the owner edits this block, the
# registry only reads it.
scope:
  does:
    - durable SQLite job queue behind an HTTP API; pluggable scrape and fetch engines
    - research cache, remote fetch fabric, cost ledger, tier memory
  does_not:
    - a user-facing UI
    - agent orchestration beyond calling a CLI for research
    - localization, recruiting, media
  out_of_scope_categories:
    - software-engineering/ui-surfaces
    - software-engineering/client-architecture
    - software-engineering/llm-agent/companion
    - software-engineering/llm-agent/orchestration
    - software-engineering/engineering-assessment
  out_of_scope_subjects:
  directions_ledger: .ai/directions/ledger.jsonl
