[package]
name = "app-crawl"
version.workspace = true
edition.workspace = true

[dependencies]
pumper-core.workspace = true
async-trait.workspace = true
serde_json.workspace = true
tracing.workspace = true
# Web Reliability Index: `{host}@{date}` observation keys.
chrono.workspace = true
# Version-archive artifact copies (async fs, no new runtime feature surface).
tokio = { workspace = true, features = ["fs"] }
# Provenance (M12): sha256 of the archived page body stamped on each
# `page_versions` revision.
sha2.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
pumper-core = { workspace = true, features = ["test-support"] }
