[package]
name = "app-plugin"
version.workspace = true
edition.workspace = true

[dependencies]
pumper-core.workspace = true
async-trait.workspace = true
# Checkpoint state blobs (M23) are derived Serialize/Deserialize structs.
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
# Versioned-archive source mode: `as_of` timestamp comparison + backfill URL patterns.
chrono.workspace = true
regex.workspace = true

[dev-dependencies]
# `run()`-level tests: the shared AppContext builder + TempStore fixture. The
# app crate itself has no tokio edge (the fan-out is `futures`-only), so the
# runtime is a test-only dependency.
pumper-core = { workspace = true, features = ["test-support"] }
tokio.workspace = true
uuid.workspace = true
async-trait.workspace = true
