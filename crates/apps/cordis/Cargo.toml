[package]
name = "app-cordis"
version.workspace = true
edition.workspace = true
# Path-only workspace member: never published to a registry.
publish = false

[dependencies]
pumper-core.workspace = true
# The grants family's shared app-layer helper crate: `SweepEnd`/`walk_end` (the
# sweep-honesty vocabulary), the drift predicates, and `topic_lineage` — the
# Horizon identifier grammar that joins open SEDIA topics to funded CORDIS
# outcomes. This used to be `app-eu-sedia.workspace = true`, an app->app edge
# the layering rule forbids, bought for that one 23-line function.
grants-common.workspace = true
async-trait.workspace = true
serde_json.workspace = true
url.workspace = true

[dev-dependencies]
tokio.workspace = true
pumper-core = { workspace = true, features = ["test-support"] }
