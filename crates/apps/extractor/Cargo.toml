[package]
name = "app-extractor"
version.workspace = true
edition.workspace = true

[dependencies]
pumper-core.workspace = true
async-trait.workspace = true
# Checkpoint state blobs (M23) are derived Serialize/Deserialize structs.
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
# Versioned-archive source mode: `as_of` timestamp comparison + backfill URL patterns.
chrono.workspace = true
regex.workspace = true
# Wayback historical backfill (`source.archive`): CDX range enumeration + raw snapshot URLs.
pumper-engine-archive.workspace = true
# Web Reliability Index: shared host-observation persistence + `host_of` live
# in the sibling crawl app crate (path dep — both crates are workspace members).
app-crawl = { path = "../crawl" }

[dev-dependencies]
uuid.workspace = true
pumper-core = { workspace = true, features = ["test-support"] }
