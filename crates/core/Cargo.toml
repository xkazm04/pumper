[package]
name = "pumper-core"
version.workspace = true
edition.workspace = true
# Path-only workspace member: never published to a registry.
publish = false

[features]
# `storage` pulls sqlx + the SQLite-backed modules (Storage/Datasets/HttpCache +
# the AppContext/ScrapeApp runtime). Default-on for the Pumper server + apps.
# Downstream embedders that only want the engine traits + Fetcher + Markdown
# (e.g. Personas) depend with `default-features = false` to drop sqlx entirely
# (avoids a duplicate libsqlite3 link against a bundled rusqlite).
default = ["storage"]
storage = ["dep:sqlx", "dep:ring", "dep:cron"]
# Shared test harness (`pumper_core::testing`): TempStore RAII fixture, Dead
# engines, AppContext builder. Enable from [dev-dependencies] ONLY.
test-support = ["storage", "dep:tempfile"]

[dependencies]
tokio.workspace = true
sqlx = { workspace = true, optional = true }
scraper.workspace = true
ego-tree.workspace = true
regex.workspace = true
rayon.workspace = true
simd-json.workspace = true
url.workspace = true
futures.workspace = true
sha2.workspace = true
hex.workspace = true
async-trait.workspace = true
dashmap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
skyscraper = "0.7"
tempfile = { version = "3", optional = true }
# App-declared schedules (P.4): the cron a run asks for is PARSED before the
# row is written, so an unreadable expression is refused instead of stored as a
# schedule that never fires.
cron = { workspace = true, optional = true }
# N16 mesh envelopes: ed25519 verification. Optional so a
# `default-features = false` embedder (engines + Fetcher only) never links it.
# (The hex wire encoding uses the unconditional `hex` dependency above.)
ring = { workspace = true, optional = true }
# LightTrack emitter (M25): a fire-and-forget POST alongside the internal cost
# ledger. Same reqwest major the HTTP/archive engines already carry, so this
# adds no new dependency to the tree — just a new edge from core onto it.
reqwest.workspace = true

[dev-dependencies]
# Self-referential: core's own integration tests get the harness.
pumper-core = { path = ".", features = ["test-support"] }
# `test-util`: `#[tokio::test(start_paused = true)]` gives the governor's spacing
# tests a virtual clock, so they assert exact durations instead of racing a loaded runner.
tokio = { workspace = true, features = ["test-util"] }
