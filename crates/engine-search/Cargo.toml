[package]
name = "pumper-engine-search"
version.workspace = true
edition.workspace = true

[dependencies]
pumper-core.workspace = true
tantivy.workspace = true
async-trait.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
# M14 entity enrichment: conservative index-time extraction (both already
# workspace deps — regex for money/date patterns, chrono for calendar validity).
