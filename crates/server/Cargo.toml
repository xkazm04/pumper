[package]
name = "pumper-server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "pumper"
path = "src/main.rs"

[dependencies]
# Needed at build time (not just dev): the worker's JobCheckpointer implements
# pumper-core's async CheckpointSink trait.
async-trait.workspace = true
pumper-core.workspace = true
pumper-engine-http.workspace = true
pumper-engine-archive.workspace = true
pumper-engine-remote.workspace = true
pumper-engine-browser.workspace = true
pumper-engine-claude.workspace = true
pumper-engine-wasm.workspace = true
pumper-engine-search.workspace = true
app-connector-api-watch.workspace = true
app-hackernews.workspace = true
app-research.workspace = true
app-readable.workspace = true
app-watch.workspace = true
app-grants-gov.workspace = true
app-cms-fee-schedule.workspace = true
app-census-density.workspace = true
app-census-nonemp.workspace = true
app-census-nesd.workspace = true
app-census-bfs.workspace = true
app-cordis.workspace = true
app-homewyse-pricing.workspace = true
app-state-tax.workspace = true
app-state-licensing.workspace = true
app-valuation-multiples.workspace = true
app-trade-wages.workspace = true
app-ca-grants.workspace = true
app-eu-sedia.workspace = true
# The unified-grants vocabulary the read views must agree with the producers on
# (`deadline_end_utc`: when a grant is actually over). Server -> shared app
# crate is within the dependency rule; only app -> app and app -> engine are not.
grants-common.workspace = true
app-mpsv-vpm.workspace = true
app-mpsv-ispv.workspace = true
app-extractor.workspace = true
app-plugin.workspace = true
app-crawl.workspace = true
app-repair.workspace = true
app-smlouvy-dump-watch.workspace = true
app-provisioner.workspace = true
app-transact.workspace = true
app-peer.workspace = true

axum.workspace = true
tower-http.workspace = true
tokio.workspace = true
tokio-util.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
reqwest.workspace = true
futures.workspace = true
async-stream.workspace = true
serde.workspace = true
serde_json.workspace = true
jsonschema.workspace = true
sha2.workspace = true
# Node identity (N16): the ed25519 keypair under `data/node.key`.
ring.workspace = true
hmac.workspace = true
hex.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sentry.workspace = true
sentry-tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
cron.workspace = true
# N16: the [[peer]] schedule reconcile writes its rows fenced on
# `managed_by = 'peer'`; there is no storage-layer writer with a caller-chosen
# id + params, and adding one is outside this change's file scope.
sqlx.workspace = true

[dev-dependencies]
pumper-core = { workspace = true, features = ["test-support"] }
# Compiles the shared component fixture (crates/engine-wasm/tests/fixtures) so
# the dynamic-app e2e runs a REAL component through the worker without needing
# an external wasm toolchain on the machine.
wat = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
async-trait.workspace = true
sqlx.workspace = true
