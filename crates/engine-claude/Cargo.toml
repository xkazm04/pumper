[package]
name = "pumper-engine-claude"
version.workspace = true
edition.workspace = true
# Path-only workspace member: never published to a registry.
publish = false

[dependencies]
pumper-core.workspace = true
tokio.workspace = true
async-trait.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
# The fake-CLI harness (crates/engine-claude/tests/): temp-dir scripts that play
# the part of `claude` so `research()` is testable without an API key or spend.
tempfile = "3"
# N15: the self-hosted loop keys its per-run token on a job id, so the argv
# tests need to mint one.
uuid.workspace = true

