# ── US business demographics & formation (Ledgerline trades intelligence) ────
# The annual census-density/census-nonemp stock apps predate the catalog and are
# CATALOG_EXEMPT in the server's coverage test; these two are ON the scheduler,
# so they are cataloged here — the drift-gate cross-checks cron vs schedule().
#
# The two PRODUCT datasets — `census/market_blend` and `census/saturation`, the
# cross-app blend all four census apps re-derive — have NO row here, and cannot
# have an honest one today (verified 2026-08-12):
#   * the coverage test (crates/server/src/routes/mod.rs,
#     `live_catalog_entries_map_to_registered_apps_with_matching_cron`) panics
#     unless a live row's `app` is a REGISTERED app, and `census` is a virtual
#     namespace no app is registered under;
#   * both consumers of a row key on the pair the data actually lands under:
#     `enforce_contracts` (worker.rs) reads the pair off each revision, i.e.
#     ("census", …), and /catalog/health reads `datasets.list(s.app, s.dataset)`.
# So the only row shape that would function is exactly the one the test refuses.
# Filing them under a producing app instead (app = "census-density", dataset =
# "market_blend") would compile and pass, and would be a lie: that pair is never
# written, so the contract would never evaluate and /catalog/health would report
# the source permanently stale. `cordis-topic-stats` is NOT a precedent for this
# — cordis writes `topic_stats` under its own app namespace. The one existing
# instance of the misfiled shape is `state-licensing` (row says
# state-licensing/compliance; the app writes trades/compliance).
# The fix belongs in the server seam (teach the coverage test that a row may
# name a virtual namespace fed by registered apps), not in this file.

[[source]]
id = "census-bfs"
app = "census-bfs"
market = "us"
name = "Census Business Formation Statistics (EITS BFS timeseries)"
url = "https://api.census.gov/data/timeseries/eits/bfs?get=cell_value,data_type_code,category_code,seasonally_adj&for=us:*&time_slot_id=0"
category = "market-stats"
engine = "http"
access = "api-key"
cadence = "weekly"
cron = "0 0 11 * * FRI"
status = "live"
confidence = 4
dataset = "formations"
notes = "Monthly business applications (BA_BA) + high-propensity (BA_HBA) per NAICS sector, US-NATIONAL ONLY — the BFS geography is us (geography.json fips=[us]; for=state:XX and for=state:* both HTTP 400), NSA, refreshed weekly by Census. A working request REQUIRES for=us:* AND time_slot_id=0. QUIRK: predicate columns are DUPLICATED in the header row — resolve columns by first occurrence. National sector grain ONLY (grain=naics_sector_national on every record) — no state or trade-level inference. Also derives formation_velocity (T12M/YoY/acceleration, one national record per sector) and refreshes census/market_blend's formation block (labeled national). Free CENSUS_API_KEY (shared); keyless requests 302 to missing_key.html. LIVE-verified with a real key 2026-07-30."

# Declared data contract (M20) for the `formations` records (live-verified
# shape 2026-07-30). `applications` is honest-Null when suppressed upstream, so
# it is range-bounded (>= 0 when present) but NOT required.
[source.contract]
required_fields = ["sector", "geo", "period", "grain"]
max_row_delta_pct = 50.0
max_staleness_hours = 336

[source.contract.types]
sector = "string"
period = "string"
grain = "string"

[source.contract.ranges]
applications = { min = 0.0 }
high_propensity_applications = { min = 0.0 }

