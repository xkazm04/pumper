[[source]]
id = "mpsv-vpm"
app = "mpsv-vpm"
market = "cz"
name = "MPSV / ÚP ČR – Volná místa za celou ČR (national vacancy register)"
url = "https://data.mpsv.cz/od/soubory/volna-mista/volna-mista.json"
category = "labor-market"
engine = "http"
access = "key-free"
cadence = "daily"
cron = "0 0 6 * * *"
status = "live"
confidence = 5
dataset = "role_region_agg"
notes = "~188 MB single JSON {polozky:[]}, replaced daily, CC BY 4.0. Per posting: monthly salary min/max CZK, profeseCzIsco, employer IČO, kraj/okres/obec, public/agency flags. Parsed to a typed subset and aggregated in-memory (CZ-ISCO×kraj×orgType) → role_region_agg (+ national kraj=ALL cell) and vacancy_samples; a full per-posting upsert is avoided (upsert_many is per-row). Needs the raised [http] timeout_secs. Verified live 2026-07-05."

# Declared data contract (M20) for `role_region_agg`. The salary bounds ARE the
# app's own SALARY_MIN/SALARY_MAX admission band — a value outside it means the
# parser broke, not that the market moved. count={min=1} deliberately, not 3: the
# privacy floor is the `minCount` param and a legitimate minCount=1 run must not
# warn. No max_staleness_hours: the daily cadence already derives the window and
# a tighter number fires on one skipped run.
[source.contract]
required_fields = ["czIsco", "krajId", "orgType", "count", "salaryCount"]
max_row_delta_pct = 20.0

[source.contract.types]
czIsco = "string"
krajId = "string"
orgType = "string"
count = "number"
salaryCount = "number"
salaryMedian = "number"

[source.contract.ranges]
count = { min = 1.0 }
salaryMin = { min = 5000.0, max = 2000000.0 }
salaryMedian = { min = 5000.0, max = 2000000.0 }
salaryMax = { min = 5000.0, max = 2000000.0 }

