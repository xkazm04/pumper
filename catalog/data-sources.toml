[[source]]
id = "cordis"
app = "cordis"
market = "eu"
name = "CORDIS Search API (funded Horizon projects)"
url = "https://cordis.europa.eu/api/search/results + https://cordis.europa.eu/project/id/{id}?format=json"
category = "awarded-history"
engine = "http"
access = "key-free"
cadence = "weekly"
cron = "0 0 7 * * 1"
status = "live"
confidence = 3
dataset = "projects"
notes = "Funded Horizon project outcomes, two-stage (VERIFIED live 2026-07-30): search listing (q=contenttype='project' AND programme/code='HORIZON') enumerates project ids only; per-project detail fetch supplies money (ecMaxContribution/totalCost), clean ISO dates, topic identifiers (relations.associations relatedMasterCall/SubCall) and orgs (legalName + per-org ecContribution + role). RCN-keyed into cordis/projects; aggregated per topic-lineage family into cordis/topic_stats; eu-sedia joins a history block onto open SEDIA topics pre-upsert. Drift raises a loud error, INCLUDING a listing that reports total:0 while projects are already stored (the older /project/frameworkProgramme= grammar does exactly that) — that run fails and leaves the cursor untouched. Resume cursor in cordis/state is an OFFSET into the listing (next_offset, with next_page/skip_in_page/page_size as its readable projection) and covers the ~23k corpus across runs (maxProjects = detail fetches/run, default 500). corpus_swept is true ONLY when page arithmetic against the listing's own reported total proved the end; the result's `sweep` field is complete|capped|short_page, and a short page keeps the cursor's place instead of wiping ~46 weeks of walk. searchAfter cursor noted for future deep paging."

# Declared data contract (M20) for the normalized project detail (live-verified
# 2026-07-30), which always carries `rcn`; the id-only fallback exists solely for
# drift, so requiring `rcn` is exactly the signal wanted. Money is honest-Null,
# so the ranges only trip on genuinely corrupt numbers. Upsert-only: removals are
# never legitimate for a funded-project archive.
[source.contract]
required_fields = ["rcn"]
max_row_delta_pct = 10.0
max_staleness_hours = 192

[source.contract.types]
rcn = "string"
title = "string"
ec_contribution = "number"
participants = "array"

[source.contract.ranges]
ec_contribution = { min = 0.0, max = 2000000000.0 }
total_cost = { min = 0.0, max = 2000000000.0 }

# The SECOND data product of the same app (the reconciler keys schedules per
# APP, so this row adds no second schedule — it exists to give `topic_stats` its
# own declared contract and its own freshness row on /sources). It is a rollup,
# not a fetch: no URL of its own beyond the corpus it aggregates.
[[source]]
id = "cordis-topic-stats"
app = "cordis"
market = "eu"
name = "CORDIS topic-family win statistics (rollup of cordis/projects)"
url = "https://cordis.europa.eu/project/id/{id}?format=json"
category = "awarded-history"
engine = "http"
access = "key-free"
cadence = "weekly"
cron = "0 0 7 * * 1"
status = "live"
confidence = 3
dataset = "topic_stats"
notes = "Per-topic-lineage-family funded-outcome rollup recomputed over the WHOLE stored cordis/projects corpus on every run, and joined by eu-sedia onto open Horizon topics as a `history` block. Written with sync_many since 2026-08-12: the batch is a complete recompute, so a family whose projects left the corpus is TOMBSTONED instead of lingering as a ghost row eu-sedia kept serving. Every record carries a `coverage` block ({corpus_aggregated, corpus_total, corpus_swept}) because the walk takes ~46 weeks — these are partial-corpus priors for most of a year and must say so. If the corpus read ever comes back at AGGREGATE_LIMIT (200k, ~8.7x the corpus) the rollup is partial and removal detection is switched off for that run, reported as aggregate_truncated + a warning."

# Removals are now legitimate here (a family can genuinely leave the corpus),
# which is exactly why max_row_delta_pct is declared: it is the mass-tombstone
# tripwire on the new sync path. `coverage` is required because a stats record
# without it is a partial-corpus number presented as the whole truth.
[source.contract]
required_fields = ["family", "project_count", "coverage"]
max_row_delta_pct = 10.0
max_staleness_hours = 192

[source.contract.types]
family = "string"
project_count = "number"
coverage = "object"
top_participants = "array"

[source.contract.ranges]
project_count = { min = 0.0, max = 100000.0 }
mean_ec_contribution = { min = 0.0, max = 2000000000.0 }
total_ec_contribution = { min = 0.0, max = 2000000000000.0 }

