notes = "Owners of nonemployer firms per age band x 2-digit SECTOR NAICS x state (absnesdo, OWNRAGE question, all-demographics slice only). Per-state data exists at sector grain ONLY: NAICS2017=23 returns real rows; =238 / =2381 return HTTP 204 No Content — a contract-VALID empty meaning 'not published at this grain', not drift. Disclosure-suppressed cells dropped, never zeroed. Feeds pct_owners_55plus + succession_receipts on census/market_blend at sector grain (labeled succession_grain=naics_sector) — a succession wave-size indicator, not a per-business or per-trade prediction. Free CENSUS_API_KEY (shared); NES-D lags ~2y (params.year). LIVE-verified with a real key 2026-07-30."

# Declared data contract (M20) for `owner_age` (live-verified shape 2026-07-30).
