# ─────────────────────────────────────────────────────────────────────────────
# Pumper Data-Source Catalog
#
# The single source of truth for WHAT this machine scrapes and HOW. One
# `[[source]]` entry per data pipeline. Both humans and LLMs read this to assess
# the state of the data pipelines at a glance. The schema is documented in
# `catalog/README.md`; keep this file in sync with the registered apps.
#
# Every field (copy this block when adding a source):
#   id          stable kebab-case slug; == the Pumper app `name()` when 1:1
#   app         Pumper app crate serving it (crates/apps/<app>); "" if not built yet
#   market      jurisdiction id (app's scheme): us, us-ca (California), eu, au,
#               gb, cz, ca (Canada), ...  NB: us-ca = California, ca = Canada
#   name        human name of the source
#   url         primary endpoint / portal
#   category    open-calls | awarded-history | registry | labor-market | market-stats
#               (labor-market = job postings + wage benchmarks; a separate domain
#                from the grant/nonprofit categories above)
#               (market-stats = US business demographics/formation statistics for
#                the Ledgerline trades intelligence; scheduled Census apps live
#                here so the server drift-gate can cross-check their crons)
#   engine      http | browser | claude | bulk        (http/browser = web, claude = llm, bulk = file download)
#   access      key-free | api-key | bulk | scrape
#   cadence     one-time | on-demand | daily | weekly | monthly | quarterly | annual
#   cron        exact 6-field expr (sec min hour dom mon dow) when on the scheduler; "" otherwise
#   status      live | planned | blocked
#   confidence  1-5  output-validity confidence (from data-source research)
#   dataset     Datasets dataset name it writes (ctx.upsert); "" if n/a
#   notes       freeform flags / gotchas
# ─────────────────────────────────────────────────────────────────────────────

# ── US federal backbone — one build serves every US org ──────────────────────

[[source]]
id = "grants-gov"
app = "grants-gov"
market = "us"
name = "Grants.gov Search2 API"
url = "https://api.grants.gov/v1/api/search2"
category = "open-calls"
engine = "http"
access = "key-free"
cadence = "daily"
cron = "0 0 9 * * *"
status = "live"
confidence = 5
dataset = "opportunities"
notes = "POST-only (bare GET = 403). Verified live: 1366 posted opps, dedup confirmed. Scheduled runs also harvest fetchOpportunity details (harvestDetails default true since 2026-08-04, delta-only + capped) into grants/opportunity_details — the only source of federal award amounts, since Search2 publishes none. That stage is non-fatal to the listing: failures are counted in the result's detailsFailed."

# Declared data contract (M20): the floor every publish must clear. Fields are
# the raw Search2 hit shape live-verified 2026-07-30 (`id` arrives as string OR
# number, so only `title`/`number` are type-pinned).
#
# NO max_row_delta_pct, deliberately (removed 2026-08-13). It is a MASS-DELETE
# tripwire and nothing else: `Contract::evaluate` (crates/core/src/catalog.rs)
# computes the delta only when `removed > 0`, and `removed` is populated only by
# `Datasets::sync_many`, the full-snapshot variant that tombstones. This app's
# listing write is `upsert_many_with_provenance`, which never tombstones — so
# the 50.0 declared here from M20 until now could not fire on ANY run. A safety
# net that cannot fire is worse than none: it reads as coverage. The break it was
# meant to catch (the federal corpus suddenly collapsing) is caught instead by
# the app's own sweep honesty — `SweepEnd` names how the walk ended, a page the
# server's own hitCount places inside the corpus that parses zero `oppHits` fails
# the run, and a `hitCount:0` answer over a stored corpus fails as query-grammar
# drift. Compare `cordis-topic-stats` below, which DOES write with sync_many and
# where the identical declaration is live and load-bearing.
#
# The same declaration is still inert on `ca-grants` and `eu-sedia` (both
# upsert-only). They are left untouched here because they belong to their own
# apps' change sets; the applicability rule is written down in
# docs/features/catalog.md so the next contract author does not add a third.
[source.contract]
required_fields = ["id", "title"]
max_staleness_hours = 48

[source.contract.types]
title = "string"
number = "string"

# `grants/opportunity_details` — the ONLY source of federal award amounts in the
# product — still has no `[[source]]` row of its own, and cannot have an honest
# one today (verified empirically 2026-08-13, same trap as the `census/*` product
# datasets documented further down):
#   * grants-gov's detail harvest writes the pair ("grants", "opportunity_details")
#     — `grants` is a VIRTUAL namespace (crates/server/src/registry.rs), not a
#     registered app;
#   * the coverage test `live_catalog_entries_map_to_registered_apps_with_matching_cron`
#     (crates/server/src/routes/mod.rs) panics on a live row whose `app` is not a
#     registered app — measured: "live catalog source 'grants-opportunity-details'
#     names unregistered app 'grants'";
#   * both consumers key on the pair the data actually lands under —
#     `enforce_contracts` (worker.rs) reads it off each revision, and
#     /catalog/health reads `datasets.list(s.app, s.dataset)`.
# So filing it as app = "grants-gov" would compile and pass the test and be a lie:
# that pair is never written, so /catalog/health would report the source
# permanently stale and the contract would never evaluate. `cordis-topic-stats` is
# NOT a precedent — cordis writes `topic_stats` under its own app namespace.
# The fix is the same one the census block asks for: teach the coverage test that
# a row may name a virtual namespace whose publishers are registered. Until then
# the detail corpus is described in the grants-gov `notes` above and guarded by
# the app's own tests, not by a contract.

