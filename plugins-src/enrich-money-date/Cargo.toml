# Reference index-time ENRICHER plugin for Pumper (N11). Build with:
#   cargo build --release --target wasm32-unknown-unknown
# then copy target/wasm32-unknown-unknown/release/enrich_money_date.wasm
# to data/plugins/enrich-money-date.wasm (`just plugins-install` does both).
[package]
name = "enrich-money-date"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl"] }

[profile.release]
opt-level = "s"
lto = true
strip = true

# Detach from the parent Pumper workspace (this targets wasm32, not the host).
[workspace]
