[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/engine-http",
    "crates/engine-archive",
    "crates/engine-remote",
    "crates/engine-browser",
    "crates/engine-claude",
    "crates/engine-wasm",
    "crates/engine-search",
    "crates/server",
    "crates/apps/*",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
# internal
pumper-core = { path = "crates/core" }
pumper-engine-http = { path = "crates/engine-http" }
pumper-engine-archive = { path = "crates/engine-archive" }
pumper-engine-remote = { path = "crates/engine-remote" }
pumper-engine-browser = { path = "crates/engine-browser" }
pumper-engine-claude = { path = "crates/engine-claude" }
pumper-engine-wasm = { path = "crates/engine-wasm" }
pumper-engine-search = { path = "crates/engine-search" }
app-connector-api-watch = { path = "crates/apps/connector-api-watch" }
app-hackernews = { path = "crates/apps/hackernews" }
app-research = { path = "crates/apps/research" }
app-readable = { path = "crates/apps/readable" }
app-watch = { path = "crates/apps/watch" }
app-grants-gov = { path = "crates/apps/grants-gov" }
grants-common = { path = "crates/apps/grants-common" }
app-cms-fee-schedule = { path = "crates/apps/cms-fee-schedule" }
census-common = { path = "crates/apps/census-common" }
app-census-density = { path = "crates/apps/census-density" }
app-census-nonemp = { path = "crates/apps/census-nonemp" }
app-census-nesd = { path = "crates/apps/census-nesd" }
app-census-bfs = { path = "crates/apps/census-bfs" }
app-cordis = { path = "crates/apps/cordis" }
app-homewyse-pricing = { path = "crates/apps/homewyse-pricing" }
app-state-tax = { path = "crates/apps/state-tax" }
app-state-licensing = { path = "crates/apps/state-licensing" }
app-valuation-multiples = { path = "crates/apps/valuation-multiples" }
app-trade-wages = { path = "crates/apps/trade-wages" }
trades-common = { path = "crates/apps/trades-common" }
app-ca-grants = { path = "crates/apps/ca-grants" }
app-eu-sedia = { path = "crates/apps/eu-sedia" }
app-mpsv-vpm = { path = "crates/apps/mpsv-vpm" }
app-mpsv-ispv = { path = "crates/apps/mpsv-ispv" }
app-extractor = { path = "crates/apps/extractor" }
app-plugin = { path = "crates/apps/plugin" }
app-smlouvy-dump-watch = { path = "crates/apps/smlouvy-dump-watch" }
app-crawl = { path = "crates/apps/crawl" }
app-provisioner = { path = "crates/apps/provisioner" }
app-transact = { path = "crates/apps/transact" }
app-peer = { path = "crates/apps/peer" }

# async runtime + web
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
axum = "0.8"
tower-http = { version = "0.7", features = ["catch-panic", "trace", "cors", "compression-gzip", "compression-br"] }

# OpenAPI spec generation (machine-readable route surface at /openapi.json)
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-axum = "0.2"

# storage
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }

# scraping engines
reqwest = { version = "0.12", features = ["json", "cookies", "gzip", "brotli", "socks"] }
# Serializable cookie jar behind reqwest's `cookie_provider` (session vault).
# Already in the tree as reqwest's own cookie store — this is a direct edge, not
# a new dependency.
cookie_store = "0.22"
scraper = "0.23"
# HTML/text charset decoding (windows-1250 etc.). Already in the tree as
# reqwest's own body decoder — this promotes it to a direct edge for the
# streamed-body path, which bypasses reqwest's `.text()` charset handling.
encoding_rs = "0.8"
ego-tree = "0.10"
chromiumoxide = { version = "0.8", default-features = false, features = ["tokio-runtime"] }
futures = "0.3"

# high-throughput extraction (no-GIL parallelism + SIMD)
regex = "1"
rayon = "1"
simd-json = "0.14"
url = "2"

# sandboxed WASM plugin runtime
wasmtime = "46"

# embedded full-text search (in-process, no external service)
tantivy = "0.26"

# shared
dashmap = "6"
async-trait = "0.1"
async-stream = "0.3"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Params-schema validation for app manifests (enqueue 422s + the MCP surface).
jsonschema = { version = "0.30", default-features = false }
toml = "0.9"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Error reporting. Default features are deliberate: the `transport` default is
# reqwest + native-tls, the same stack the HTTP engine already uses (schannel on
# Windows, no OpenSSL), so it introduces no new *native* dependency — it does
# pull a second reqwest MAJOR (0.13 alongside the workspace's 0.12), which is the
# accepted cost of a supported transport. `sentry-tracing` bridges the existing
# `tracing::error!` sites into Sentry rather than replacing stdout logging.
sentry = "0.48"
sentry-tracing = "0.48"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
cron = "0.17"

[profile.release]
lto = "thin"

# Disk economy on Windows MSVC. Measured 2026-08-26: target/ had reached 280.8 GB
# in ONE month. Two halves, both structural rather than accidental.
#
# 105.9 GB of it was PDBs. This workspace links ~200 separate test binaries (63
# integration-test files plus per-crate unit tests), each of which statically
# links the whole workspace and so carried its own 120-800 MB full-debuginfo PDB
# — in 7-16 stale hash-variant copies apiece, because cargo garbage-collects
# `target/` never. `line-tables-only` keeps file:line in panic backtraces, which
# is what actually makes a test failure readable, and drops the variable/type
# tables that are the bulk. Third-party deps get nothing at all: nobody steps
# through wasmtime, tantivy or chromiumoxide, and they are most of the mass.
# (`package."*"` matches dependencies only, never workspace members.)
#
# The other 134.5 GB was incremental state, 2,806 compiler session dirs. The
# dominant loop in this repo is `cargo test --workspace` — `just test`, `just ci`
# — where incremental buys nearly nothing and pays for it in disk, so it is off
# by default. The edit loop keeps it: `just check` sets CARGO_INCREMENTAL=1, and
# `cargo check` units carry their own fingerprints, so re-enabling it there can
# never thrash against build/test units. Flip `incremental` back to `true` here
# if a session is doing heavy `just build`/`just dev` iteration instead.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = 0

# Build scripts and proc macros are never debugged from a backtrace here.
[profile.dev.build-override]
debug = 0
