# Pumper — local scraping service configuration.
# Every key is optional; defaults are baked into the binary (see crates/core/src/config.rs).

[server]
host = "127.0.0.1"
port = 8088

[worker]
concurrency = 4              # max jobs running at once, across all apps
job_timeout_secs = 900
poll_interval_secs = 2
default_app_concurrency = 0  # per-app cap for fairness (0 = unlimited)
schedule_tick_secs = 15      # how often the scheduler checks cron schedules
# [worker.app_concurrency]   # per-app overrides
# research = 1               # only one research (Claude) job at a time

[storage]
database_path = "data/pumper.db"
artifacts_dir = "data/artifacts"
# Revision-history retention (OFF by default — a dataset's accrued history is the
# product's value, so pruning is opt-in). When enabled, a janitor prunes
# `record_revisions` older than N days every 6h, always keeping the newest
# `revision_retention_keep_min` per record so diffs/history stay usable.
# revision_retention_days = 90
# revision_retention_keep_min = 5

[http]
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
# Total per-request timeout (the client-global default). Bulk sources that need
# longer (e.g. mpsv-vpm's ~188 MB feed) set `HttpRequest.timeout_secs` per request
# rather than degrading this global — a hung host should free its worker slot in
# ~30s, not sit for 300s.
timeout_secs = 30
retries = 3

# Per-domain politeness governor — spaces out requests to the same host.
[governor]
enabled = true
default_rps = 2.0            # requests/sec per host (0 = unlimited)
jitter_ms = 250             # random extra delay to de-sync bursts
# [governor.per_domain]     # per-host overrides
# "news.ycombinator.com" = 1.0

# Tiered fetcher (http -> browser -> claude) tuning that isn't per-request.
[fetcher]
min_content_chars = 250         # a tier whose extracted text is thinner escalates
# Host profiles (learned tier memory): strikes + the browser pin decay after
# this age, giving an aged-out host a fresh crack at the cheap HTTP tier
# (0 = never age, the old pin-forever behaviour).
host_memory_ttl_secs = 604800   # 7 days
# How often the governor's learned per-host penalties are snapshotted to the DB
# so they survive a restart (0 = in-memory only).
host_penalty_persist_secs = 60
# Session vault: named login profiles a fetch can run under (`profile` on a
# request). Each lives in <profiles_dir>/<name>/ — cookies.json (persistent HTTP
# cookie jar) + browser/ (that profile's Chrome user-data-dir), created on first
# use. Session state only: no credential management, no encryption at rest.
profiles_dir = "data/profiles"

# Content-addressed HTTP response cache with TTL.
[cache]
enabled = true
ttl_secs = 3600

# Background cache refresher (M02 self-refreshing mirror) — piggybacks on the
# scheduler tick to conditionally revalidate cached entries just before their
# PREDICTED next change (an EWMA over the observed change gaps in the
# `revalidations` log; GET /cache/freshness shows the model). Strictly polite:
# each request is admitted only through the governor's non-blocking idle-slot
# try_acquire, and hard per-tick budgets bound total background traffic.
[refresher]
enabled = false
# horizon_secs = 300        # revalidate keys whose predicted change is within this window
# global_per_tick = 10      # max background revalidations per scheduler tick
# per_host_per_tick = 2     # max per host per tick
# retention_days = 30       # revalidation-log retention

# Tier-zero archive engine (Wayback Machine CDX, v1). When enabled AND a fetch
# sets `archive_max_age` (seconds), the tiered fetcher tries a stored
# web.archive.org snapshot BEFORE touching the live site — zero load on the
# target, zero ban risk. A missing/older-than-window/thin snapshot always falls
# through to the live ladder. Archive requests run through the normal HTTP
# engine, so archive.org gets the same politeness governor as any host.
[archive]
enabled = false
# base_url = "https://web.archive.org"   # override for a self-hosted pywb

# Distributed fetch fabric (M17 v1). One switch drives both sides: when enabled
# this node SERVES `POST /fetch-proxy` (peers run fetches through this node's
# local stack — governor, cache, caps included; shared-secret auth), and when
# `nodes` is also non-empty the tiered fetcher's live-HTTP tier DISPATCHES to
# those peers round-robin, falling back to the local engine on any node error.
# `secret` MUST be set when enabled (an unauthenticated /fetch-proxy would be an
# open proxy); use the same value on every node of the cluster. Cluster-wide
# governor state is a later slice — each node stays individually polite.
[remote]
enabled = false
# nodes = ["http://10.0.0.2:8088"]  # peers to dispatch to; empty = serve-only
# secret = ""                       # REQUIRED when enabled; shared across the cluster
# timeout_secs = 60                 # per proxy call, end to end
# max_body_bytes = 16777216         # cap on a proxied response body (16 MiB)

# Learned API-recipe replay (M05, see GET /recipes). When enabled (or a fetch
# sets `use_recipes`), a VALIDATED recipe for the request's host replays the
# page's discovered JSON API ahead of the archive and live tiers — one governed
# HTTP call, structured JSON back (TierTrace tier `api_recipe`). A failed/thin
# replay records a strike and always falls through to archive/live;
# `max_failures` consecutive strikes un-validate the recipe.
[recipes]
enabled = false
# auto_validate = false   # ON: also try unvalidated recipes; a successful
#                         # overlapping replay marks them validated
# max_failures = 3        # consecutive failed replays that un-validate

[browser]
chrome_executable = 'C:\Program Files\Google\Chrome\Application\chrome.exe'
headless = true
# Persistent profile: log in to sites once (headless = false), scrape behind logins forever after.
user_data_dir = "data/browser-profile"
default_wait_ms = 1000
nav_timeout_secs = 30
# Cap on captured HTML per render (bytes); mirrors [http] max_body_bytes so a
# JS-heavy page can't balloon memory on the browser tier. Default 16 MiB; 0 = off.
# max_html_bytes = 16777216

[claude]
binary = "claude"
timeout_secs = 600
# effort = "high"            # global default reasoning effort
# max_budget_usd = 2.0       # global hard spend ceiling per run
bare = false                 # pass --bare for faster CLI startup
# Local power mode: the CLI runs with permission prompts disabled.
skip_permissions = true
allowed_tools = ["WebSearch", "WebFetch"]

# Model/effort presets apps select by name (3rd-party apps can override per job).
[claude.roles.research]
model = "claude-sonnet-5"    # latest Sonnet for research gathering
effort = "high"              # normal reasoning

[claude.roles.compose]
model = "claude-opus-4-8"    # Opus for composing research output
effort = "xhigh"             # maximum practical reasoning

# Sandboxed WASM plugin host — runs untrusted .wasm extractors with hard limits.
[plugins]
enabled = true
dir = "data/plugins"         # .wasm modules loaded at boot; hot-swap via POST /plugins/reload
fuel = 200000000            # per-call CPU instruction budget (traps runaway plugins)
max_memory_mb = 64          # hard linear-memory cap per call (per instance)
max_concurrent = 0          # max plugin runs at once host-wide (0 = one per CPU core); bounds aggregate wasm memory + blocking-pool use
# app_dir = "data/apps"     # OPTIONAL (M28 v1): dir scanned at boot for dynamic-app .wasm modules exporting describe().
#                           # Discovered apps are LISTED read-only in GET /apps (dynamic: true, runnable: false) and
#                           # enqueue rejects them with 409 — running them needs the component-model host (next slice).

# Embedded full-text search (Tantivy) — in-process, no external service.
[search]
enabled = true
dir = "data/search-index"
# Per-run cap on hits a materialized saved search (POST /searches with
# `materialize: {app, dataset}`) snapshots into its view dataset.
max_materialize_results = 500

# Result delivery via webhooks (job callbacks + dataset-watch events).
[webhooks]
# failure_url = "https://ops.example.com/pumper/failures"  # optional job.failed firehose
# failure_secret = "..."                                    # HMAC-SHA256 secret for failure_url
auto_retry = true   # auto-drain the dead-letter queue: re-send failed deliveries with backoff (30s→1m→5m→30m→2h, then 'dead')

# Inbound event ingress (POST /ingest/{id}) — HMAC-verified external webhooks
# become `external` events on the bus that triggers can match (on 'external' +
# source filter + $.path predicates). This is the FIRST write surface designed
# for non-localhost callers, so it ships OFF; every source carries its own
# signing secret. See docs/features/ingress.md for the GitHub worked example.
[ingress]
enabled = false
# max_body_bytes = 262144    # hard cap per inbound event body (256 KiB)
# rate_limit_per_min = 60    # per-source token bucket (also the burst size)
# max_skew_secs = 300        # accepted clock skew for timestamped signatures

# Extraction health — per-source degradation detection (see
# docs/features/resilient-extraction.md). Detection is arithmetic over data the
# extraction pass already produced, so it is effectively free; the only thing
# with a cost is what it is allowed to gate.
[resilience]
enabled = true
enforce = false             # false = compute and store every verdict, gate NOTHING (soak mode).
                            # Flip to true only after `GET /sources` shows the false-positive
                            # rate is acceptable on real data: on an unattended box a false
                            # quarantine that silently stops a working pipeline is worse than
                            # a detection that arrives a week late.
min_cohort_docs = 30        # documents a run needs before distributional tests apply
window_runs = 20            # healthy runs pooled into the rolling baseline
degrade_score = 0.6         # score at which a run counts as tripped
quarantine_score = 0.85     # score at which it also counts as severe
fetch_ok_floor = 0.7        # below this the run is `inconclusive`: you cannot judge an
                            # extractor on documents you did not receive
mad_z = 3.5                 # robust-z flag threshold (Iglewicz-Hoaglin)
drift_low = 0.08            # normalized fingerprint drift at/below which an input is unchanged
drift_high = 0.20           # ...and at/above which it has moved
invariant_refresh_days = 14
invariant_min_support = 500      # records an invariant must hold over before it is trusted
invariant_min_confidence = 0.99
invariant_violation_ratio = 0.2  # fraction of a cohort that must break one to count
sketch_retention_runs = 60       # runs of per-field sketches kept (>= window_runs)

# Catalog GitOps reconciler — treats catalog/data-sources.toml as desired state
# for the schedules table. Boot always runs a DRY-RUN and logs drift loudly;
# review with GET /catalog/reconcile, apply with POST /catalog/reconcile.
# Only schedules tagged managed_by = "catalog" are ever written; hand-made and
# code-seeded rows are sacred.
[catalog]
auto_reconcile = false   # true = apply the boot plan automatically (orphans are still never touched)

# Declared data contracts ([source.contract] blocks in catalog/data-sources.toml).
# Always evaluated at publish time and surfaced on /catalog/health + /sources;
# this only decides whether a violation also gates (verdict block vs warn).
[contracts]
enforce = false   # soak mode first, exactly like [resilience] enforce

# MCP server — mounts /mcp: POST (streamable-HTTP JSON-RPC) exposing the app
# registry, datasets, and search as native agent tools, plus catalog + app
# manifests as resources; GET (SSE) streaming live JSON-RPC notifications
# bridged from the event bus (?app=/?kind= filters, Last-Event-ID resume).
# Read-mostly by design: the actuating tools (enqueue_job, fetch_readable,
# deep_research) share one opt-in switch AND a hard budget ceiling.
# See docs/features/mcp.md for the .mcp.json client snippet.
[mcp]
enabled = false
# allow_enqueue = false      # second opt-in: offer enqueue_job/fetch_readable/deep_research at all
# max_job_budget_usd = 1.0   # hard clamp on any MCP-enqueued job's budget_usd (0 = free tiers only)
# wait_job_max_secs = 60     # cap on the wait_job tool's timeout_secs (bounds one held tool call)

# DataHub metadata shadow — pushes dataset entities, inferred schema, lineage,
# and per-run freshness (operation) events to a DataHub GMS. Metadata only;
# record data never leaves the local store. See docs/features/datahub.md.
[datahub]
enabled = true
gms_url = "http://localhost:8080"             # local docker quickstart (Cloud: https://<tenant>.acryl.io/gms)
# token = "..."                               # or put DATAHUB_TOKEN in .env (quickstart needs none)
# env = "PROD"                                # URN fabric segment
# emit_schema = true                          # infer schemaMetadata from each dataset's newest record
# emit_profile = true                         # emit row-count datasetProfile
# emit_flows = true                           # M25: schedules as dataFlow, runs as dataJob (in/out edges), trigger DAG + RuleSet column lineage
# govern = false                              # M26: OPT-IN pull loop — DataHub deprecation / cost:pause tags / failing assertions act on the fleet
# govern_interval_secs = 300                  # governance poll cadence (min 30)

# Information economics (M04) — GET /economics joins the cost ledger with
# per-job yield (job_yield) into $/new-record and $/changed-record per app over
# trailing 7d/30d windows, plus an ADVISORY budget/cadence recommendation per
# app. Advisory only: enforce is a stub for the deferred enforcement mode
# (scheduler reads the planner's budgets) and nothing acts on it yet.
[economics]
enforce = false          # DEFERRED seam — inert today, ships OFF so landing enforcement can't silently start moving money
# Per-app value weights: how much one fresh (new/changed) record from an app is
# worth relative to the fleet baseline 1.0 (a rare grant >> one HN row).
# Unlisted apps weigh 1.0.
[economics.weights]
# grants-gov = 5.0
# hackernews = 0.2
