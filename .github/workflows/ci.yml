name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # NOTE: no `cargo fmt --check` gate yet — the tree is not fmt-clean.
      # Add it after a dedicated fmt-the-world commit.
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Test
        # Environment-dependent tests (real Chrome, wasm artifact, wall-clock
        # timing) are #[ignore]d; run them locally with `cargo test -- --ignored`.
        run: cargo test --workspace
