name: CI

on:
  push:
    branches: [master]
  pull_request:
  # TWO crons, and each one reaches only the jobs it is for.
  #
  # A workflow's `schedule:` list fires the WHOLE workflow, so adding the nightly
  # entry below would have silently promoted every job here — format, both test
  # legs, the SDK, the inventory walk and the audit — from weekly to nightly.
  # That is a five-fold CI spend increase bought by accident, and the kind of
  # change nobody notices until the bill. `github.event.schedule` carries the
  # cron expression that fired, so every job below states which schedule it
  # answers to; see the `if:` on each.
  #
  #   17 6 * * 1  weekly — the RUSTSEC advisory database changes independently of
  #               this repo, so a crate we already depend on can become vulnerable
  #               with no commit of ours. Everything that runs per-change also
  #               runs here, unchanged from before.
  #   41 5 * * *  nightly — the long lanes ONLY. Certifications on their own
  #               clock: blocking a merge on them would destroy the merge cadence
  #               without improving the certification, because the property they
  #               certify (behaviour over time and pressure) is not a property of
  #               any single change.
  schedule:
    - cron: "17 6 * * 1"
    - cron: "41 5 * * *"
  # So a human can run the long lanes on demand — before a release, or to confirm
  # a fix, without waiting for the next night.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting is its OWN job, and deliberately not a step of `test`.
  #
  # It used to be step 1 of the single job below, and between 2026-07-26 and
  # 2026-08-24 that ordering aborted 85 of 86 runs: `cargo fmt --check` failed,
  # every later step reported `skipped`, and Clippy, the whole test suite and
  # each plugin/artifact step never executed once. A rung that has never bound
  # is not a gate — so the whole ladder was advisory for a month while the badge
  # said otherwise (registry: quality-gates/gate-laddering, "the binding rung
  # binds only if it can be green").
  #
  # As a parallel job it still BLOCKS — a failed job fails the workflow and the
  # required-status-check list on master should name `Format` alongside `test`
  # and `Dependency audit` — but a stray space can no longer blind the suite:
  # every rung now reports its own verdict independently, on the same commit.
  # Seconds to run, so it needs neither the wasm target nor the build cache.
  format:
    name: Format
    # Weekly cron only, never the nightly one — see the `schedule:` note above.
    # True for push, pull_request and workflow_dispatch, so nothing about this
    # job's per-change behaviour (or its required-check status) changes.
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '17 6 * * 1' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --check

  # Two legs, because the primary development box is Windows and CI was
  # ubuntu-only: every `#[cfg(windows)]` path and every file-locking absorption
  # in `crates/core/src/testing.rs` was gated nowhere, and the platform whose
  # quirks the code works around was the one platform no gate ever ran on
  # (registry: test-harness/platform-quirk-absorption).
  #
  # `fail-fast: false` so a Windows-only failure still lets the Linux leg report
  # — the same reason Format is its own job. The wasm/plugin rungs stay
  # Linux-only (see the `if:` on those steps): they drive justfile recipes
  # written for `sh`, and the artifact they build is platform-independent.
  test:
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '17 6 * * 1' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          # plugins-src/* are cdylib crates targeting wasm32 in their OWN
          # detached workspaces, so `cargo test --workspace` never compiles
          # them. Nothing here did either, which meant a shipped trigger-hook
          # plugin could stop building — or stop exporting the host ABI — and
          # the only symptom was a fail-open hop in production: a gate nobody
          # deployed reads exactly like a gate that said yes.
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The plugin steps below drive the justfile rather than restating its
      # loop, so the recipe stays the single definition of "how a plugin is
      # built and installed" (CLAUDE.md: the justfile is the canonical runner).
      - uses: taiki-e/install-action@v2
        if: runner.os == 'Linux'
        with:
          tool: just
      # Every verdict step below carries `if: ${{ !cancelled() }}` for the same
      # reason Format is now its own job: a failing rung must not silence the
      # rungs after it. The job still FAILS if any of them fails — this only
      # buys the full report, so one clippy lint cannot hide a broken test the
      # same commit also introduced. `!cancelled()` rather than `always()` so a
      # cancelled run still stops promptly. The setup steps above stay
      # short-circuiting: without a toolchain there is nothing to report.
      - name: Clippy
        # `-D warnings` makes lints gate the build rather than scroll past in the
        # log. The workspace is clippy-clean as of the commit that added this;
        # the two intentional exceptions are narrow, per-site `#[allow]`s with a
        # comment naming the reason (crates/apps/plugin/src/lib.rs — a `cloned()`
        # required for closure lifetime inference; crates/server/src/webhook.rs —
        # the 8-argument webhook wire contract).
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Flake detection is a query over RETAINED history, so the history has to
      # accumulate across runs — a per-run artifact does not accumulate, it just
      # piles up. The rolling key is the standard shape: every run saves under a
      # unique key and restores from the newest prefix match, so each run starts
      # from the previous one's records instead of from nothing.
      - name: Restore flake history
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@v4
        with:
          path: .flake/history
          key: flake-history-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: flake-history-${{ runner.os }}-
      - name: Test
        if: ${{ !cancelled() }}
        # Environment-dependent tests (real Chrome, wasm artifact, wall-clock
        # timing) are #[ignore]d; run them locally with `just test-ignored`.
        #
        # This is a REQUIRED check, so the wrapper's contract is narrow and
        # absolute: it forwards cargo's exit code byte for byte, changes nothing
        # about what runs, and wraps every recording step so an instrument
        # failure is a warning on stderr and never a verdict. It only reads the
        # output — which is why this is a wrapper and not cargo-nextest, whose
        # process-per-test model and absent doctests would change what this rung
        # measures. See .flake/README.md.
        run: node scripts/ci/flake-record.mjs -- cargo test --workspace
      - name: Save flake history
        # Not `!cancelled()`: a FAILING run is the most valuable sample this
        # history can hold — an outcome transition needs the red half — so the
        # save must survive the step above going red.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .flake/history
          key: flake-history-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      # After the main suite, so installing artifacts into data/plugins/ cannot
      # change what it saw. `data/` is gitignored and no clone ever ships these
      # artifacts, so this is the first place they exist in CI at all.
      - name: Build + install every plugins-src crate
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: just plugins-install
      - name: Plugin crate unit tests (host target)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: just plugins-test
      # The artifact tests are still #[ignore]d — a clean checkout has no wasm
      # target and no built .wasm, and a default `cargo test` must not depend on
      # a build step. They are not optional HERE: this is the step that turns a
      # host-ABI break red, because it loads each installed module and asks the
      # host whether it is executable (`Plugins::has`), which merely compiling
      # the crate cannot answer.
      - name: Artifact tests (the #[ignore]d wasm ones)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: |
          cargo test -p pumper-engine-wasm --test plugins -- --ignored
          cargo test -p pumper-server e2e::trigger_plugins -- --ignored

  # Named after the artifact, not after the tool, so the checks list can be read
  # against the ship inventory. `clients/typescript` is a PUBLISHED consumer SDK
  # in its own npm project: `cargo test --workspace` cannot reach it, nothing
  # else here compiled it, and `.ai/manifest.yaml` advertised an `sdk-typecheck`
  # capability no job invoked. It depends on this server's wire contract by
  # convention rather than by a type, so the break it is exposed to is a route
  # or payload change made over here with a green board over there.
  #
  # It names its own manifest, scopes its own cache to its own lockfile, and
  # runs what the artifact ships (its test script, which builds first) rather
  # than merely type-checking it.
  sdk:
    name: "@pumper/sync (TypeScript SDK)"
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '17 6 * * 1' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json
      - name: Install
        run: npm --prefix clients/typescript ci
      - name: Typecheck
        run: npm --prefix clients/typescript run typecheck
      - name: Test
        if: ${{ !cancelled() }}
        run: npm --prefix clients/typescript test

  # The two node-only gates, together because both are seconds and neither needs
  # a toolchain: the ship-inventory walk (does every package manifest in the tree
  # name a job) and the doc-sync hook's own fixture suite (does the repo's only
  # doc-drift instrument still fire). The hook is a local Stop hook, so on a
  # clone without .claude/settings.json it does not exist at all — this is the
  # rung that at least keeps it from rotting unnoticed.
  inventory:
    name: Ship inventory + doc-sync hook
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '17 6 * * 1' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Ship inventory
        run: node --test scripts/ci/ship-inventory.test.mjs
      - name: Doc-sync hook fixtures
        if: ${{ !cancelled() }}
        run: node --test scripts/docs/check-doc-sync.test.mjs

  # The quarantine register as a gate, plus the fixture suites that prove both
  # this gate and the lane certifier can still go red.
  #
  # Its own job, not a step of `test`, for the reason `Format` is its own job:
  # every rung reports its own verdict on the same commit, and a broken register
  # must not be able to hide behind a compile error (or the other way round).
  # Node only, seconds, no toolchain.
  harness:
    name: Test harness gates
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '17 6 * * 1' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Restore-only: this job records nothing, it just wants the history so the
      # published figures below carry a real trend instead of "first sample".
      - name: Restore flake history
        uses: actions/cache/restore@v4
        with:
          path: .flake/history
          key: flake-history-Linux-report-${{ github.run_id }}
          restore-keys: flake-history-Linux-
      - name: Flake register
        # Exit 2 = findings (an expired entry, an orphan, an unregistered flake,
        # a breached ceiling). Exit 3 = COULD NOT CHECK, which is not a pass.
        run: node scripts/ci/flake-check.mjs
      - name: Harness gate fixtures
        if: ${{ !cancelled() }}
        run: |
          node --test scripts/ci/flake-check.test.mjs
          node --test scripts/ci/lane-certify.test.mjs
      # Register size WITH its trend and the age of the oldest entry, published
      # wherever the suite's health is published — a size with no trend is a
      # number, and a register growing monotonically is deletion with a slower
      # fuse. Lane health goes in the same summary so "never green" is visible
      # to whoever is already looking at the board.
      - name: Publish harness health
        if: ${{ !cancelled() }}
        run: |
          {
            echo '## Test harness health'
            echo '```'
            node scripts/ci/flake-check.mjs --report || true
            node scripts/ci/lane-certify.mjs --report || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The long lanes: nightly and on demand, never on a per-change gate.
  #
  # These are certifications, not gates. They judge against bounds declared in
  # .lanes/criteria.json BEFORE the run, they emit one artifact per run, and the
  # lane's dashboard is the sequence of artifacts rather than any single verdict
  # — which is why the health ledger is cached across runs and the verdicts are
  # uploaded with a retention long enough to outlive a cache eviction.
  #
  # It does NOT replace the artifact-test steps in the Linux `test` job above:
  # those still run on every change and still turn a host-ABI break red. This
  # adds the schedule and the lane-health record on top.
  long-lanes:
    name: Long lanes (nightly)
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '41 5 * * *') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Restore lane health + flake history
        uses: actions/cache/restore@v4
        with:
          path: |
            .flake/history
            .lanes/health.json
          key: lane-health-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: lane-health-
      # The two artifact lanes need the built plugins; without them their tests
      # skip rather than fail, which is exactly why those lanes carry a
      # `tests_run` minimum as well as a `tests_failed` maximum.
      - name: Build + install every plugins-src crate
        run: just plugins-install
      # Every lane below carries `!cancelled()` so one red lane cannot silence
      # the rest — the same reason `Format` is its own job. The certifier still
      # sees whatever artifacts were produced, and a lane that produced none is
      # reported as cannot-see rather than as a pass.
      - name: Lane — datasets-bulk-upsert
        if: ${{ !cancelled() }}
        run: node scripts/ci/flake-record.mjs --lane datasets-bulk-upsert -- cargo test -p pumper-core --test datasets_bulk_perf bulk_upsert_50k_cost_report -- --ignored --nocapture
      - name: Lane — datasets-duplicate-scan
        if: ${{ !cancelled() }}
        run: node scripts/ci/flake-record.mjs --lane datasets-duplicate-scan -- cargo test -p pumper-core --test datasets_bulk_perf duplicate_scan_50k_cost_report -- --ignored --nocapture
      - name: Lane — derived-backfill
        if: ${{ !cancelled() }}
        run: node scripts/ci/flake-record.mjs --lane derived-backfill -- cargo test -p pumper-core --test derived_backfill_perf -- --ignored --nocapture
      - name: Lane — fingerprint-shared-dom
        if: ${{ !cancelled() }}
        run: node scripts/ci/flake-record.mjs --lane fingerprint-shared-dom -- cargo test -p pumper-core --test fingerprint_shared_dom perf_ -- --ignored --nocapture
      - name: Lane — wasm-plugin-artifacts
        if: ${{ !cancelled() }}
        run: node scripts/ci/flake-record.mjs --lane wasm-plugin-artifacts -- cargo test -p pumper-engine-wasm --test plugins -- --ignored
      - name: Lane — server-trigger-plugins
        if: ${{ !cancelled() }}
        run: node scripts/ci/flake-record.mjs --lane server-trigger-plugins -- cargo test -p pumper-server e2e::trigger_plugins -- --ignored
      # The rest of the --ignored set, recorded but not certified: the timing
      # tests in the flake register. This is the compensating control for
      # libtest having no `muted` form — the two quarantined tests keep
      # producing the outcome history that will eventually release them,
      # entirely off the blocking path.
      - name: Quarantined tests (recorded, not blocking)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node scripts/ci/flake-record.mjs --lane quarantine-watch -- cargo test -p pumper-core --lib governor -- --ignored
      - name: Certify
        if: ${{ !cancelled() }}
        run: node scripts/ci/lane-certify.mjs
      - name: Publish lane health
        if: ${{ !cancelled() }}
        run: |
          {
            echo '## Long lanes'
            echo '```'
            node scripts/ci/lane-certify.mjs --report || true
            node scripts/ci/flake-check.mjs --report || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save lane health + flake history
        # `always()`, because a failed lane is the run whose record matters most.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .flake/history
            .lanes/health.json
          key: lane-health-${{ github.run_id }}-${{ github.run_attempt }}
      # The lane's dashboard is the SEQUENCE of artifacts, and a cache entry can
      # be evicted; 90 days of uploads is what keeps a trend readable after one.
      - name: Upload lane artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-artifacts-${{ github.run_id }}
          path: |
            .lanes/runs
            .lanes/verdicts
          retention-days: 90
          if-no-files-found: warn

  audit:
    name: Dependency audit
    # The job the weekly cron exists FOR — and now the one that must say so, or
    # the nightly lane cron would have quietly started running it every night.
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '17 6 * * 1' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # cargo-deny over cargo-audit: this service fetches untrusted web content
      # and executes operator-supplied WASM, so "is there a CVE" (advisories) is
      # only part of the question — `sources` proves every crate still comes from
      # crates.io, and `bans` keeps a vulnerable copy from hiding behind a second
      # major. Policy and every waiver live in ./deny.toml.
      # `licenses` is deliberately absent from this list; see deny.toml for the
      # one-step follow-up that turns it on.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources
