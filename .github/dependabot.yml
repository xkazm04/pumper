version: 2

updates:
  # Rust dependencies. Weekly so the lockfile keeps moving without a PR per day.
  # Grouping keeps routine patch/minor churn to a single reviewable PR while
  # leaving majors as their own PRs, since those are the ones that need thought.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # ego-tree is not ours to choose: `crates/core/src/markdown.rs` walks the
      # tree that `scraper` hands back, so our version must be the exact one
      # scraper links against (scraper 0.23 -> ego-tree 0.10). Taking a bump on
      # its own puts two ego-trees in the graph and `NodeRef` stops matching.
      # It moves when scraper moves; until then every such PR is a false lead.
      - dependency-name: "ego-tree"

  # The workflow's own actions (checkout, rust-toolchain, rust-cache,
  # cargo-deny-action). These are third-party code running with repo credentials,
  # so keeping them current is part of the same supply-chain surface deny.toml
  # covers for crates.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
